<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RES-588 — Approved prototype vs implemented product</title>
<style>
  :root { --bg:#0a1016; --panel:#101922; --line:#23333e; --text:#e3edf2; --muted:#7f919d; --lime:#c8f36b; --cyan:#5fd4e8; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"IBM Plex Sans","Segoe UI",sans-serif; font-size:11px; }
  header { display:flex; align-items:baseline; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); }
  header b { font-size:14px; } header span { color:var(--muted); font-family:"IBM Plex Mono",monospace; font-size:8px; }
  main { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line); height:calc(100vh - 45px); }
  section { background:var(--panel); padding:8px; display:grid; grid-template-rows:22px 1fr; min-height:0; }
  section h2 { margin:0; font-size:9px; font-weight:500; color:var(--muted); font-family:"IBM Plex Mono",monospace; text-transform:uppercase; letter-spacing:.08em; }
  section h2 b { color:var(--lime); font-weight:400; }
  img { width:100%; height:100%; object-fit:contain; object-position:top left; background:#071016; border:1px solid var(--line); }
</style>
</head>
<body>
<header><b>RES-588 visual comparison</b><span>Approved Direction F prototype (left) · Implemented Performance OS (right) · 1440×900</span></header>
<main>
  <section>
    <h2><b>Approved</b> · f-command-1440x900.png</h2>
    <img src="../screens/f-command-1440x900.png" alt="Approved Squad Command prototype">
  </section>
  <section>
    <h2><b>Implemented</b> · implemented/today-1440.png</h2>
    <img src="today-1440.png" alt="Implemented Squad Command">
  </section>
</main>
</body>
</html>
