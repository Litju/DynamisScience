[project]
name = "dynamis-science-service"
version = "0.1.0"
description = "Native scientific research workstation and Performance OS for DynamisScience"
requires-python = ">=3.12"
license = { text = "Proprietary. All rights reserved. See LICENSE." }
dependencies = [
  "pydantic>=2.10,<3",
  "numpy>=2.2,<3",
  "polars>=1.27,<2",
  "pyarrow>=18,<21",
  "duckdb>=1.1,<2",
  "scipy>=1.15,<2",
  "statsmodels>=0.14,<1",
  "PySide6-Essentials>=6.8,<7",
  "pyqtgraph>=0.13,<1",
  "matplotlib>=3.9,<4",
  "openpyxl>=3.1,<4"
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-qt>=4.4,<5",
  "pyinstaller>=6.22,<7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
